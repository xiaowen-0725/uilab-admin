name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  install-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check:changed -- "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - name: Typecheck (includes Workbench sidecar)
        run: pnpm typecheck

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests (includes Workbench sidecar)
        run: pnpm test

      - name: Build the project
        run: pnpm build
